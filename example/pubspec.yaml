name: formio_example
description: "Example app for the formio package — renders Form.io forms natively via the @formio/core engine."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  formio:
    path: ../packages/flutter_formio

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/form-samples/
