name: speech2form
description: "Speech2Form — Voice-powered conversational form filling with Form.io + AI"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  formio:
    path: ../packages/flutter_formio
  formio_api:
    path: ../packages/formio_api
  flutter_tts: ^4.2.0
  speech_to_text: ^7.0.0
  openai_dart: ^0.6.2
  shared_preferences: ^2.5.4
  geocoding: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/

dependency_overrides:
  formio_api:
    path: ../packages/formio_api
